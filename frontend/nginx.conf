server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    # Essencial para o roteamento do Angular funcionar
    try_files $uri $uri/ /index.html;
  }

  # Redireciona todas as chamadas /api para o serviço de backend
  location /api {
    # 'backend' é o nome do serviço Spring Boot no compose.yaml
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Reescreve a URL, removendo o /api do início antes de enviar ao backend
    # Ex: /api/users -> /users
    rewrite /api/(.*) /$1 break;
  }
}
